[project]
name = "ie403"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.16.0",
    "bitsandbytes>=0.50.2",
    "joblib>=1.6.0",
    "numpy>=2.5.5",
    "rapidfuzz>=3.14.6",
    "regex>=2026.11.19",
    "scikit-learn>=1.9.1",
    "sentencepiece[protobuf]>=0.2.3",
    "torch>=2.15.0",
    "tqdm>=4.70.1",
    "underthesea>=9.5.0",
]

[dependency-groups]
runtime = ["datasets>=5.2.0", "transformers>=5.24.0"]
# Transformers 4 keeps MoE experts as Linear layers that bitsandbytes can quantize.
attacks = ["datasets==4.4.1", "transformers==4.57.6"]

[tool.uv]
default-groups = ["runtime"]
conflicts = [[{ group = "runtime" }, { group = "attacks" }]]
